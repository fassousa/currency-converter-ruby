name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, fagnner_sousa ]
  pull_request:
    branches: [ main, develop ]

env:
  RUBY_VERSION: '3.3.5'
  BACKEND_DIR: backend

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: currency_converter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/currency_converter_test
      REDIS_URL: redis://localhost:6379/0
      CURRENCY_API_KEY: test_api_key_for_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.BACKEND_DIR }}

      - name: Setup database
        working-directory: ${{ env.BACKEND_DIR }}
        run: bin/rails db:create db:schema:load

      - name: Run RuboCop
        working-directory: ${{ env.BACKEND_DIR }}
        run: bundle exec rubocop --parallel

      - name: Run tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: bundle exec rspec --format documentation

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.BACKEND_DIR }}/coverage/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.BACKEND_DIR }}

      - name: Run Brakeman
        working-directory: ${{ env.BACKEND_DIR }}
        run: bundle exec brakeman --no-pager --format plain

      - name: Run bundler-audit
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          gem install bundler-audit
          bundle audit check --update

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://currency-converter-ruby.fly.dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        working-directory: ${{ env.BACKEND_DIR }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health Check
        run: |
          echo "🏥 Verifying production health check..."
          for i in {1..5}; do
            RESPONSE=$(curl -sf -H "Accept: application/json" https://currency-converter-ruby.fly.dev/api/v1/health || true)
            if echo "$RESPONSE" | grep -q "healthy"; then
              echo "✅ Production is healthy! ($RESPONSE)"
              exit 0
            fi
            echo "⚠️ Retry $i/5..."
            sleep 3
          done
          echo "❌ Health check failed!"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Verified at https://currency-converter-ruby.fly.dev"
          echo "📌 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

